name: CI [Webhook Inbox]

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Typecheck
        run: uv run mypy

      - name: Test
        run: uv run pytest -q -m "not slow"

      - name: Search benchmark (100k events, asserts no collection scan)
        run: uv run pytest -q -m slow

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Known vulnerabilities in runtime dependencies
        run: |
          uv export --format requirements-txt --no-emit-project --no-dev > requirements.txt
          uvx pip-audit -r requirements.txt

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the stack
        run: docker compose up --build -d --wait
        env:
          ADMIN_PASSWORD: ci-admin-password

      - name: Sign in and keep the session
        run: |
          csrf=$(curl -fsS -c /tmp/cookies -X POST http://localhost:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"ci-admin-password"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["csrf_token"])')
          echo "CSRF=$csrf" >> "$GITHUB_ENV"

      - name: The dashboard is not reachable anonymously
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/endpoints)
          [ "$code" = 401 ] || { echo "unauthenticated API returned $code, expected 401"; exit 1; }

      - name: Send a webhook and assert it lands
        run: |
          curl -fsS -X POST http://localhost:8000/webhooks/demo \
            -H 'Content-Type: application/json' \
            -H 'X-Webhook-Event: user.created' \
            -d '{"event":"user.created","user":{"id":1827,"name":"John Doe"}}'
          curl -fsS -b /tmp/cookies http://localhost:8000/events | grep -q 'user.created'

      - name: Search finds the event, including through a typo
        run: |
          curl -fsS -b /tmp/cookies 'http://localhost:8000/events?q=user.created' | grep -q 'user.created'
          curl -fsS -b /tmp/cookies 'http://localhost:8000/events?q=creted' | grep -q 'user.created'

      - name: Filters narrow the event list
        run: |
          curl -fsS -b /tmp/cookies 'http://localhost:8000/events?type=user.created' | grep -q 'user.created'
          if curl -fsS -b /tmp/cookies 'http://localhost:8000/events?q=zzzznothing' | grep -q '<tbody>'; then
            echo "a query matching nothing still rendered rows"; exit 1
          fi

      - name: HMAC endpoint accepts a signed body and rejects a tampered one
        run: |
          secret=ci-secret
          curl -fsS -b /tmp/cookies -X POST http://localhost:8000/api/endpoints \
            -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" \
            -d "{\"name\":\"github\",\"path\":\"github\",\"authentication\":{\"type\":\"hmac_sha256\"},\"secret\":\"$secret\"}"

          body='{"action":"opened"}'
          sig="sha256=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$secret" | awk '{print $2}')"

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/webhooks/github \
            -H 'Content-Type: application/json' -H "X-Hub-Signature-256: $sig" -d "$body")
          [ "$code" = 202 ] || { echo "signed request got $code, expected 202"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8000/webhooks/github \
            -H 'Content-Type: application/json' -H "X-Hub-Signature-256: $sig" -d '{"action":"tampered"}')
          [ "$code" = 401 ] || { echo "tampered request got $code, expected 401"; exit 1; }

      - name: Endpoint secrets never leave the API
        run: |
          if curl -fsS -b /tmp/cookies http://localhost:8000/api/endpoints | grep -q 'ci-secret'; then
            echo "secret leaked via the API"; exit 1
          fi
          if docker compose logs app | grep -q 'ci-secret'; then
            echo "secret leaked into the logs"; exit 1
          fi
          echo "no secret leaked"

      - name: Sign-in is throttled
        run: |
          codes=""
          for i in $(seq 1 14); do
            codes="$codes $(curl -s -o /dev/null -w '%{http_code}' \
              -X POST http://localhost:8000/api/auth/login \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"wrong"}')"
          done
          echo "sign-in attempts:$codes"
          case "$codes" in
            *429*) echo "password guessing is throttled" ;;
            *) echo "sign-in was never throttled"; exit 1 ;;
          esac

      - name: Oversized headers and query strings are refused
        run: |
          long=$(python3 -c 'print("x" * 8000)')
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "http://localhost:8000/webhooks/demo?pad=$long" -d '{}')
          [ "$code" = 414 ] || { echo "long query returned $code, expected 414"; exit 1; }

          python3 -c 'print("\n".join(f"header = \"x-pad-{i}: v\"" for i in range(1, 201)))' > /tmp/hdrs.conf
          code=$(curl -s -o /dev/null -w '%{http_code}' -K /tmp/hdrs.conf \
            -X POST http://localhost:8000/webhooks/demo -d '{}')
          [ "$code" = 431 ] || { echo "header flood returned $code, expected 431"; exit 1; }
          echo "request shape limits enforced"

      - name: Export streams every format and honours the filters
        run: |
          for fmt in json jsonl csv; do
            curl -fsS -b /tmp/cookies "http://localhost:8000/events/export?format=$fmt" \
              -o "/tmp/export.$fmt"
            [ -s "/tmp/export.$fmt" ] || { echo "$fmt export was empty"; exit 1; }
          done
          python3 -c 'import json; json.load(open("/tmp/export.json"))'
          python3 -c 'import csv; assert len(list(csv.reader(open("/tmp/export.csv")))) >= 2'
          grep -q 'user.created' /tmp/export.jsonl

          # The internal search index must never reach an export
          if grep -q 'trigrams' /tmp/export.jsonl; then
            echo "the search index leaked into the export"; exit 1
          fi

          filtered=$(curl -fsS -b /tmp/cookies \
            'http://localhost:8000/events/export?format=jsonl&type=user.created' | wc -l)
          [ "$filtered" -ge 1 ] || { echo "the filtered export returned nothing"; exit 1; }

          # Chunked with no content-length is what proves it streams
          curl -s -o /dev/null -D /tmp/headers -b /tmp/cookies \
            'http://localhost:8000/events/export?format=jsonl'
          grep -qi 'transfer-encoding: chunked' /tmp/headers \
            || { echo "the export was buffered, not streamed"; cat /tmp/headers; exit 1; }
          echo "exports stream and respect filters"

      - name: Events are stored with a retention expiry
        run: |
          docker compose exec -T mongodb mongosh --quiet --eval '
            const db_ = db.getSiblingDB("webhook_inbox");
            const ttl = db_.events.getIndexes().find(i => i.name === "event_ttl");
            if (!ttl || ttl.expireAfterSeconds !== 0) { print("missing TTL index"); quit(1); }
            if (db_.events.countDocuments({expires_at: {$exists: true}}) === 0) {
              print("no event carries an expiry"); quit(1);
            }
            print("TTL index present and expiries written");
          '

      - name: Replay refuses every internal destination
        run: |
          event=$(curl -fsS -X POST http://localhost:8000/webhooks/demo \
            -H 'Content-Type: application/json' -d '{"event":"replay.probe"}' \
            | python3 -c 'import json,sys; print(json.load(sys.stdin)["id"])')

          for dest in 'http://mongodb:27017/x' 'http://127.0.0.1:8000/webhooks/demo' \
                      'http://169.254.169.254/latest/meta-data/' 'file:///etc/passwd' \
                      'gopher://mongodb:27017/_x' 'http://[::1]:8000/x'; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -b /tmp/cookies -X POST \
              "http://localhost:8000/api/events/$event/replay" \
              -H 'Content-Type: application/json' -H "X-CSRF-Token: $CSRF" \
              -d "{\"destination\":\"$dest\"}")
            [ "$code" = 400 ] || { echo "$dest was accepted with $code, expected 400"; exit 1; }
          done

          queued=$(docker compose exec -T mongodb mongosh --quiet \
            --eval "db.getSiblingDB('webhook_inbox').replays.countDocuments({})")
          [ "$queued" = 0 ] || { echo "a blocked destination was still queued"; exit 1; }
          echo "every internal destination refused, nothing queued"

      - name: Events survive an app restart
        run: |
          docker compose restart app
          timeout 60 sh -c 'until curl -fsS http://localhost:8000/ready; do sleep 2; done'
          curl -fsS -b /tmp/cookies http://localhost:8000/events | grep -q 'user.created'

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
