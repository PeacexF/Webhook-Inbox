[project]
name = "webhook-inbox"
version = "0.1.0"
description = "Self-hosted webhook inspection, search and replay platform"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.120",
    "uvicorn[standard]>=0.38",
    "pymongo>=4.16",
    "pydantic>=2.12",
    "pydantic-settings>=2.11",
    "jinja2>=3.1",
    "python-multipart>=0.0.20",
    "structlog>=25.4",
    "pyyaml>=6.0",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "httpx>=0.28",
    "testcontainers[mongodb]>=4.14",
    "ruff>=0.14",
    "mypy>=1.18",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["app"]

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real MongoDB via testcontainers",
    "slow: seeds a large dataset; deselect with -m 'not slow'",
]
