<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Webhook Inbox{% endblock %}</title>
  <style>
    :root { color-scheme: light dark; }
    body { font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; margin: 0; padding: 2rem; }
    h1 { font-size: 1.25rem; margin: 0 0 1rem; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #8883; }
    th { font-weight: 600; text-transform: uppercase; font-size: .75rem; opacity: .7; }
    .empty { opacity: .6; padding: 2rem 0; }
  </style>
</head>
<body>
  <h1>Webhook Inbox</h1>
  {% block content %}{% endblock %}
</body>
</html>
