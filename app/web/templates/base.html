<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Webhook Inbox{% endblock %}</title>
  <link rel="stylesheet" href="/static/app.css">
  <script>
    // Applied before first paint so the theme never flashes
    (function () {
      var saved = localStorage.getItem("theme");
      var dark = saved ? saved === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
  <script src="/static/htmx.min.js" defer></script>
</head>
<body{% if csrf_token %} hx-headers='{"X-CSRF-Token": "{{ csrf_token }}"}'{% endif %}>
{% block body %}
<nav class="nav">
  <span class="brand">Webhook Inbox<span class="dot">.</span></span>
  <div class="nav-links">
    <a href="/" {% if active == 'dashboard' %}class="active"{% endif %}>Dashboard</a>
    <a href="/events" {% if active == 'events' %}class="active"{% endif %}>Events</a>
    <a href="/endpoints" {% if active == 'endpoints' %}class="active"{% endif %}>Endpoints</a>
    <a href="/settings" {% if active == 'settings' %}class="active"{% endif %}>Settings</a>
  </div>
  <div class="nav-right">
    {% if user %}<span class="nav-user">{{ user.username }}</span>{% endif %}
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>
      </svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
    {% if user %}
    <button class="link" hx-post="/api/auth/logout" hx-on::after-request="window.location='/login'">
      Sign out
    </button>
    {% endif %}
  </div>
</nav>
<main>
  {% block content %}{% endblock %}
</main>
{% endblock %}
<script>
  function toggleTheme() {
    var next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    localStorage.setItem("theme", next);
  }
</script>
</body>
</html>
