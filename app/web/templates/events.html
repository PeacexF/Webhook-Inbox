{% extends "base.html" %}
{% block title %}Events — Webhook Inbox{% endblock %}
{% block content %}
<div class="toolbar">
  <h1 style="margin:0">Events</h1>
  <span class="nav-user">{{ "{:,}".format(total) }} total</span>
</div>

{% include "_events_table.html" %}

<div class="pager">
  <span>{{ events|length }} shown</span>
  {% if next_cursor %}
  <a class="btn" href="/events?before={{ next_cursor }}">Older →</a>
  {% endif %}
</div>
{% endblock %}
